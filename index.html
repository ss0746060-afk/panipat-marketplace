<script>
let currentCategory = 'all';
let productsList = [];

// 1. वेबसाइट लोड होते ही LocalStorage से पुराने प्रोडक्ट्स को निकालना
window.onload = function() {
    let savedProducts = localStorage.getItem('panipatBazaarProducts');
    if (savedProducts) {
        productsList = JSON.parse(savedProducts);
        displaySavedProducts();
    }
}

// फॉर्म खोलने और बंद करने का फंक्शन
function toggleSellForm() {
    let form = document.getElementById('sellForm');
    if(form.style.display === "block") {
        form.style.display = "none";
    } else {
        form.style.display = "block";
        window.scrollTo({top: 100, behavior: 'smooth'});
    }
}

// 2. नया प्रोडक्ट जोड़ने और उसे ब्राउज़र की मेमोरी में सेव करने का फंक्शन
function addNewProduct(event) {
    event.preventDefault();
    
    let name = document.getElementById('pName').value;
    let price = document.getElementById('pPrice').value;
    let category = document.getElementById('pCategory').value;
    let img = document.getElementById('pImg').value;
    
    // नए प्रोडक्ट का डेटा ऑब्जेक्ट बनाना
    let productData = {
        id: Date.now(), // हर प्रोडक्ट की एक यूनिक आईडी
        name: name,
        price: price,
        category: category,
        img: img
    };

    // लिस्ट में सबसे आगे जोड़ना
    productsList.unshift(productData);

    // ब्राउज़र की तिजोरी (LocalStorage) में हमेशा के लिए सेव करना
    localStorage.setItem('panipatBazaarProducts', JSON.stringify(productsList));
    
    // स्क्रीन पर दिखाना
    displaySavedProducts();

    // फॉर्म रीसेट करना और छुपाना
    document.getElementById('productForm').reset();
    document.getElementById('sellForm').style.display = "none";
    alert("🎉 बधाई हो! आपका प्रोडक्ट हमेशा के लिए लाइव हो गया है (अब रीफ्रेश करने पर भी नहीं हटेगा)।");
}

// 3. सेव किए गए प्रोडक्ट्स को स्क्रीन पर रेंडर (दिखाने) का फंक्शन
function displaySavedProducts() {
    // पहले से बने हुए यूजर के जोड़े कार्ड्स को हटाना (ताकि डुप्लीकेट न हों)
    let userCards = document.querySelectorAll('.user-added-product');
    userCards.forEach(card => card.remove());

    let container = document.getElementById('productsContainer');

    productsList.forEach(product => {
        let catHindi = "अन्य";
        if(product.category === 'mobile') catHindi = "📱 मोबाइल";
        if(product.category === 'vehicle') catHindi = "🏍️ गाड़ियां";
        if(product.category === 'furniture') catHindi = "🛋️ फर्नीचर";

        let newCard = document.createElement('div');
        newCard.className = 'card product-item user-added-product';
        newCard.setAttribute('data-category', product.category);
        
        newCard.innerHTML = `
            <img src="${product.img}" alt="${product.name}">
            <div class="card-content">
                <div class="price">₹${Number(product.price).toLocaleString('en-IN')}</div>
                <span class="category-label">${catHindi}</span>
                <div class="title">${product.name}</div>
                <div class="location">📍 Panipat</div>
                <button class="btn" onclick="buyProduct('${product.name}', '₹${product.price}')">💬 WhatsApp पर खरीदें</button>
            </div>
        `;
        // डिफ़ॉल्ट 3 प्रोडक्ट्स के ठीक ऊपर नया सामान जोड़ना
        container.insertBefore(newCard, container.firstChild);
    });

    filterProducts(); // फ़िल्टर लिस्ट अपडेट करना
}

// कंबाइंड सर्च और कैटेगरी फ़िल्टर फंक्शन
function filterCategory(cat, element) {
    currentCategory = cat;
    let tags = document.getElementsByClassName('cat-tag');
    for(let tag of tags) tag.classList.remove('active');
    element.classList.add('active');
    filterProducts();
}

function filterProducts() {
    let searchInput = document.getElementById('searchInput').value.toLowerCase();
    let cards = document.getElementsByClassName('product-item');
    let container = document.getElementById('productsContainer');
    let hasResults = false;

    let oldMessage = document.getElementById('no-match');
    if(oldMessage) oldMessage.remove();

    for (let i = 0; i < cards.length; i++) {
        let title = cards[i].querySelector('.title').innerText.toLowerCase();
        let cat = cards[i].getAttribute('data-category');
        
        let matchesSearch = title.includes(searchInput);
        let matchesCategory = (currentCategory === 'all' || cat === currentCategory);

        if (matchesSearch && matchesCategory) {
            cards[i].style.display = "block";
            hasResults = true;
        } else {
            cards[i].style.display = "none";
        }
    }

    if (!hasResults) {
        let noMatchDiv = document.createElement('div');
        noMatchDiv.id = 'no-match';
        noMatchDiv.className = 'no-results';
        noMatchDiv.innerText = 'क्षमा करें, कोई प्रोडक्ट नहीं मिला।';
        container.appendChild(noMatchDiv);
    }
}

// व्हाट्सएप बाय फंक्शन
function buyProduct(productName, price) {
    let myPhoneNumber = "919999999999"; // अपना नंबर यहाँ डालें
    let message = `नमस्ते! मुझे Panipat Bazaar पर यह पसंद आया है:\n\n🛍️ प्रोडक्ट: ${productName}\n💰 कीमत: ${price}\n\nक्या यह उपलब्ध है?`;
    let whatsappUrl = "https://api.whatsapp.com/send?phone=" + myPhoneNumber + "&text=" + encodeURIComponent(message);
    window.open(whatsappUrl, '_blank');
}
</script>
