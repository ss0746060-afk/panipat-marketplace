<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panipat Connect - स्थानीय लोगों का अपना नेटवर्क</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f2f5; }

        /* हेडर (Top Bar) */
        header { background: white; padding: 15px; text-align: center; font-weight: bold; font-size: 20px; border-bottom: 1px solid #ddd; }

        /* पोस्ट कार्ड */
        .container { max-width: 600px; margin: auto; padding: 10px; }
        .post { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .user-name { font-weight: bold; margin-bottom: 10px; display: block; }
        .post-content { margin-bottom: 10px; }
        .actions { border-top: 1px solid #eee; padding-top: 10px; }
        button { border: none; background: none; color: #555; cursor: pointer; font-weight: bold; }
        button:hover { color: #007bff; }

        /* बॉटम नेविगेशन */
        .navbar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<header>पानीपत कनेक्ट (Panipat Connect)</header>

<div class="container">
    <div class="post">
        <span class="user-name">राहुल पानीपतिया</span>
        <div class="post-content">आज पानीपत में मौसम बहुत सुहावना है! क्या कोई शाम को मॉडल टाउन चल रहा है?</div>
        <div class="actions">
            <button>❤️ लाइक</button> &nbsp; <button>💬 कमेंट</button>
        </div>
    </div>

    <div class="post">
        <span class="user-name">अंजली शर्मा</span>
        <div class="post-content">पानीपत की सबसे अच्छी मिठाई की दुकान कौन सी है? सुझाव दें!</div>
        <div class="actions">
            <button>❤️ लाइक</button> &nbsp; <button>💬 कमेंट</button>
        </div>
    </div>
</div>

<div class="navbar">
    <span>🏠 होम</span> <span>🔍 सर्च</span> <span>➕ पोस्ट</span> <span>👤 प्रोफाइल</span>
</div>

</body>
</html>
