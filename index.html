
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panipat Bazaar</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f4f5;
margin:0;
padding:0;
}

header{
background:#002f34;
color:white;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.card{

margin:20px;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.price{
font-size:24px;
font-weight:bold;
}

button{
background:#002f34;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
PANIPAT BAZAAR
</header>

<div class="card">
<div class="price">₹ 48,000</div>
<h3>iPhone 13 Pro</h3>
<p>Model Town, Panipat</p>
<button onclick="alert('Seller Contact Soon')">
Contact Seller
</button>
</div>

</body>
</html>
