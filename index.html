<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panipat Bazaar</title>

<style>
body{margin:0;font-family:Arial;background:#eaeded;padding-bottom:50px}

.header{background:#131921;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}

.sell-btn{background:#fff;padding:8px 15px;border-radius:20px;cursor:pointer;font-weight:bold}

.search-container{background:#232f3e;padding:10px;text-align:center}

.search input{padding:10px;width:70%;border:none}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}

.card{background:#fff;border-radius:10px;overflow:hidden;padding-bottom:10px}

.card img{width:100%;height:200px;object-fit:cover}

.card-content{padding:10px}

.price{color:red;font-size:20px;font-weight:bold}

.btn{background:#25D366;color:#fff;padding:10px;border:none;width:100%;cursor:pointer}

.delete-btn{background:red;color:#fff;width:100%;padding:5px;border:none;margin-top:5px;cursor:pointer}

.sell-form-section{display:none;background:#fff;padding:15px;margin:10px}

.form-group{margin-bottom:10px}

input,select{width:100%;padding:8px}
</style>
</head>

<body>

<div class="header">
<div>🛒 PANIPAT BAZAAR</div>
<div class="sell-btn" onclick="toggleForm()">+ SELL</div>
</div>

<div class="search-container">
<input id="searchInput" onkeyup="filterProducts()" placeholder="Search...">
</div>

<!-- SELL FORM -->
<div class="sell-form-section" id="sellForm">
<h3>Sell Product</h3>

<div class="form-group">
<input id="pName" placeholder="Product Name">
</div>

<div class="form-group">
<input id="pPrice" placeholder="Price">
</div>

<div class="form-group">
<input id="pOwner" placeholder="Your Name">
</div>

<div class="form-group">
<input id="pPhone" placeholder="Phone Number">
</div>

<div class="form-group">
<input id="pImg" placeholder="Image URL">
</div>

<button onclick="addProduct()" class="btn">Add Product</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<script>
let products = JSON.parse(localStorage.getItem("data") || "[]");

function render(){
let box = document.getElementById("products");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML += `
<div class="card">
<img src="${p.img}">
<div class="card-content">
<div class="price">₹${p.price}</div>
<h3>${p.name}</h3>
<p>👤 ${p.owner}</p>
<p>📞 ${p.phone}</p>

<button class="btn" onclick="buy('${p.name}','${p.price}','${p.phone}')">
WhatsApp
</button>

<button class="delete-btn" onclick="del(${p.id})">Delete</button>

</div>
</div>
`;
});

localStorage.setItem("data", JSON.stringify(products));
}

function addProduct(){
let p={
id:Date.now(),
name:pName.value,
price:pPrice.value,
owner:pOwner.value,
phone:pPhone.value,
img:pImg.value || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800"
};

products.unshift(p);
render();

sellForm.style.display="none";
alert("Product Live!");
}

function del(id){
products = products.filter(p=>p.id!=id);
render();
}

function buy(name,price,phone){
let msg=`Hi I want ${name} for ₹${price}`;
let url=`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`;
window.open(url);
}

function toggleForm(){
sellForm.style.display = sellForm.style.display==="block"?"none":"block";
}

function filterProducts(){
let val=document.getElementById("searchInput").value.toLowerCase();
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(val)?"block":"none";
});
}

render();
</script>

</body>
</html>
